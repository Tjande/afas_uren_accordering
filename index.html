<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OutSite - Uren Accorderen</title>
  <style>
    :root {
      --afas-blue: #00509d;
      --afas-light-blue: #e8f1f9;
      --bg-gray: #f8fafc;
      --border-color: #e2e8f0;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --orange: #e8890c;
      --orange-dark: #cc7a0a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-gray);
      color: var(--text-dark);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--afas-light-blue);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }

    .header h2 {
      margin: 0;
      color: var(--afas-blue);
      font-size: 20px;
    }

    /* Maandfilter */
    .filter-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--afas-light-blue);
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .filter-bar label {
      font-weight: bold;
      color: var(--afas-blue);
    }

    .filter-bar input[type="month"],
    .filter-bar select {
      padding: 6px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-dark);
    }

    /* Toolbar: entries + search */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .toolbar select,
    .toolbar input[type="text"] {
      padding: 6px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th, td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    td.wrap-cell {
      white-space: normal;
    }

    th {
      background: #f1f5f9;
      color: #475569;
      font-weight: 600;
      user-select: none;
    }

    th.sortable {
      cursor: pointer;
    }

    th.sortable:hover {
      background: #e8edf3;
    }

    .sort-arrows {
      display: inline-flex;
      flex-direction: column;
      margin-left: 4px;
      vertical-align: middle;
      font-size: 8px;
      line-height: 8px;
      color: #b6c0cc;
    }

    .sort-arrows span.active {
      color: var(--afas-blue);
    }

    th.col-check, td.col-check {
      width: 36px;
      text-align: center;
    }

    tbody tr:hover {
      background: #fafbfc;
    }

    tbody tr.no-results td {
      text-align: center;
      color: var(--text-muted);
      padding: 24px;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Footer: entries info + pagination */
    .table-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .pagination {
      display: flex;
      gap: 4px;
    }

    .pagination button {
      min-width: 32px;
      height: 32px;
      border: 1px solid var(--border-color);
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-dark);
    }

    .pagination button:hover:not(:disabled):not(.active) {
      background: var(--afas-light-blue);
    }

    .pagination button.active {
      background: var(--orange);
      border-color: var(--orange);
      color: white;
      font-weight: 600;
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pagination span.ellipsis {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      color: var(--text-muted);
    }

    .btn-verzenden {
      margin-top: 20px;
      background: var(--orange);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-verzenden:hover:not(:disabled) {
      background: var(--orange-dark);
    }

    .btn-verzenden:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>&#9998; Uren accorderen &amp; gereed melden</h2>
    <span id="klantNaam" style="font-weight: 600; color: #64748b; font-size: 13px;">Klant ID: ...</span>
  </div>

  <!-- Maand- en weekfilter -->
  <div class="filter-bar">
    <label for="monthPicker">Selecteer Periode (Maand):</label>
    <input type="month" id="monthPicker" onchange="loadHours()">

    <label for="weekFilter">Week:</label>
    <select id="weekFilter" onchange="onWeekFilterChange()">
      <option value="">Alle weken</option>
    </select>
  </div>

  <!-- Entries + Search -->
  <div class="toolbar">
    <div class="toolbar-left">
      Show
      <select id="pageSizeSelect" onchange="onPageSizeChange()">
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
      entries
    </div>
    <div class="toolbar-right">
      Search:
      <input type="text" id="searchInput" oninput="onSearchInput()" placeholder="">
    </div>
  </div>

  <!-- Urentabel -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-check"><input type="checkbox" id="selectAllCheckbox" onchange="onSelectAllChange()"></th>
          <th class="sortable" data-col="date" onclick="onSortClick('date')">Datum<span class="sort-arrows" data-col="date"><span data-dir="asc">&#9650;</span><span data-dir="desc">&#9660;</span></span></th>
          <th class="sortable" data-col="employeeName" onclick="onSortClick('employeeName')">Medewerker<span class="sort-arrows" data-col="employeeName"><span data-dir="asc">&#9650;</span><span data-dir="desc">&#9660;</span></span></th>
          <th class="sortable" data-col="project" onclick="onSortClick('project')">Project<span class="sort-arrows" data-col="project"><span data-dir="asc">&#9650;</span><span data-dir="desc">&#9660;</span></span></th>
          <th class="sortable" data-col="workType" onclick="onSortClick('workType')">Werksoort<span class="sort-arrows" data-col="workType"><span data-dir="asc">&#9650;</span><span data-dir="desc">&#9660;</span></span></th>
          <th class="sortable" data-col="description" onclick="onSortClick('description')">Omschrijving<span class="sort-arrows" data-col="description"><span data-dir="asc">&#9650;</span><span data-dir="desc">&#9660;</span></span></th>
          <th class="sortable" data-col="hours" onclick="onSortClick('hours')">Aantal<span class="sort-arrows" data-col="hours"><span data-dir="asc">&#9650;</span><span data-dir="desc">&#9660;</span></span></th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr class="no-results"><td colspan="7">Uren laden...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Footer: info + paginering -->
  <div class="table-footer">
    <span id="entriesInfo">Showing 0 to 0 of 0 entries</span>
    <div class="pagination" id="pagination"></div>
  </div>

  <button class="btn-verzenden" id="verzendBtn" onclick="verzendGeaccordeerd()" disabled>Verzenden</button>
</div>

<script>
  // VERVANG DEZE URL'S MET JOUW EIGEN N8N WEBHOOK URL'S
  const N8N_GET_URL = "https://dpprconsultancy.app.n8n.cloud/webhook/get-hours";
  const N8N_VERIFY_URL = "https://dpprconsultancy.app.n8n.cloud/webhook/verify-session";
  const N8N_POST_URL = "https://dpprconsultancy.app.n8n.cloud/webhook/approve-hours";
  // Moet exact overeenkomen met de "Value" van de 'Webhook API Key'-credential in n8n
  const N8N_API_KEY = "sk_outsite_7f3a9c2e1b8d4f6a0e5c9b2d7a1f4e8c";

  let allRows = [];        // platte lijst van alle urenregels (over alle medewerkers)
  let checkedIds = new Set();
  let searchTerm = "";
  let selectedWeek = "";   // ISO week-key, bv. "2015-W49", leeg = alle weken
  let sortColumn = "date";
  let sortDir = "asc";
  let pageSize = 10;
  let currentPage = 1;

  // Parameters die AFAS OutSite automatisch aan de iframe-URL toevoegt.
  // Als deze aanwezig zijn, gebruiken we de geverifieerde AFAS-sessie i.p.v.
  // een los (en dus vervalsbaar) debiteurnummer.
  const afasParams = new URLSearchParams(window.location.search);
  const afasSession = {
    tokenurl: afasParams.get('tokenurl'),
    code: afasParams.get('code'),
    publickey: afasParams.get('publickey'),
    sessionid: afasParams.get('sessionid')
  };
  const isAfasSession = !!(afasSession.tokenurl && afasSession.code && afasSession.publickey && afasSession.sessionid);

  document.addEventListener("DOMContentLoaded", () => {
    const today = new Date();
    const currentMonth = today.toISOString().substring(0, 7); // YYYY-MM
    document.getElementById("monthPicker").value = currentMonth;

    loadHours();
  });

  async function loadHours() {
    const month = document.getElementById("monthPicker").value;
    document.getElementById("tableBody").innerHTML = `<tr class="no-results"><td colspan="7">Uren ophalen voor ${month}...</td></tr>`;

    try {
      let response;
      if (isAfasSession) {
        // Veilige flow: n8n verifieert bij AFAS zelf wie is ingelogd
        const params = new URLSearchParams({ ...afasSession, month });
        response = await fetch(`${N8N_VERIFY_URL}?${params.toString()}`, {
          headers: { "X-Api-Key": N8N_API_KEY }
        });
      } else {
        // Fallback: losstaand testen buiten OutSite om, met handmatig debiteurnummer
        const debituurId = afasParams.get('debituurId') || '10023';
        document.getElementById("klantNaam").innerText = `Debiteurnummer: ${debituurId}`;
        response = await fetch(`${N8N_GET_URL}?debituurId=${debituurId}&month=${month}`, {
          headers: { "X-Api-Key": N8N_API_KEY }
        });
      }

      if (!response.ok) {
        throw new Error(`Serverfout (${response.status})`);
      }
      const data = await response.json();

      allRows = [];
      (data || []).forEach(emp => {
        (emp.rules || []).forEach(rule => {
          allRows.push({
            ruleId: rule.ruleId,
            date: (rule.year && rule.period) ? `${String(rule.period).padStart(2, '0')}-${rule.year}` : '',
            employeeName: emp.employeeName,
            employeeId: emp.employeeId,
            project: rule.project,
            workType: rule.itemCode || '',
            description: rule.description,
            hours: rule.hours
          });
        });
      });

      checkedIds.clear();
      currentPage = 1;
      populateWeekFilter();
      renderAll();
    } catch (err) {
      console.error(err);
      document.getElementById("tableBody").innerHTML = `<tr class="no-results"><td colspan="7" style="color:red;">Fout bij het laden van uren.</td></tr>`;
    }
  }

  function parseDateValue(value) {
    if (!value) return 0;
    // probeer DD-MM-YYYY
    const dmy = /^(\d{2})-(\d{2})-(\d{4})$/.exec(value);
    if (dmy) return new Date(`${dmy[3]}-${dmy[2]}-${dmy[1]}`).getTime();
    const t = new Date(value).getTime();
    return isNaN(t) ? 0 : t;
  }

  function parseHoursValue(value) {
    return parseFloat(String(value).replace(',', '.')) || 0;
  }

  // ISO-8601 weeknummer: week bevat de donderdag van die week
  function getISOWeekInfo(dateStr) {
    const t = parseDateValue(dateStr);
    if (!t) return null;
    const d = new Date(t);
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
    const week1 = new Date(d.getFullYear(), 0, 4);
    const weekNo = 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
    return { year: d.getFullYear(), week: weekNo, key: `${d.getFullYear()}-W${String(weekNo).padStart(2, '0')}` };
  }

  function populateWeekFilter() {
    const weekSelect = document.getElementById("weekFilter");
    const weeksMap = new Map();
    allRows.forEach(row => {
      const info = getISOWeekInfo(row.date);
      if (info) weeksMap.set(info.key, info);
    });
    const weeks = Array.from(weeksMap.values()).sort((a, b) => a.key.localeCompare(b.key));

    selectedWeek = "";
    weekSelect.innerHTML = '<option value="">Alle weken</option>' +
      weeks.map(w => `<option value="${w.key}">Week ${w.week} (${w.year})</option>`).join('');
    weekSelect.value = "";
  }

  function onWeekFilterChange() {
    selectedWeek = document.getElementById("weekFilter").value;
    currentPage = 1;
    renderAll();
  }

  function getFilteredSortedRows() {
    const term = searchTerm.trim().toLowerCase();
    let rows = allRows;

    if (selectedWeek) {
      rows = rows.filter(row => {
        const info = getISOWeekInfo(row.date);
        return info && info.key === selectedWeek;
      });
    }

    if (term) {
      rows = rows.filter(row => {
        const haystack = [row.date, row.employeeName, row.project, row.workType, row.description, row.hours]
          .join(' ').toLowerCase();
        return haystack.includes(term);
      });
    }

    rows = rows.slice().sort((a, b) => {
      let av, bv;
      if (sortColumn === 'date') {
        av = parseDateValue(a.date); bv = parseDateValue(b.date);
      } else if (sortColumn === 'hours') {
        av = parseHoursValue(a.hours); bv = parseHoursValue(b.hours);
      } else {
        av = String(a[sortColumn] || '').toLowerCase();
        bv = String(b[sortColumn] || '').toLowerCase();
      }
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });

    return rows;
  }

  function renderAll() {
    const filtered = getFilteredSortedRows();
    const totalEntries = filtered.length;
    const totalPages = Math.max(1, Math.ceil(totalEntries / pageSize));
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const start = (currentPage - 1) * pageSize;
    const pageRows = filtered.slice(start, start + pageSize);

    renderTableBody(pageRows);
    renderEntriesInfo(totalEntries, start, pageRows.length);
    renderPagination(totalPages);
    renderSortIndicators();
    syncSelectAllState(pageRows);
    updateVerzendButton();
  }

  function renderTableBody(pageRows) {
    const tbody = document.getElementById("tableBody");

    if (pageRows.length === 0) {
      tbody.innerHTML = `<tr class="no-results"><td colspan="7">Geen urenregels gevonden.</td></tr>`;
      return;
    }

    tbody.innerHTML = pageRows.map(row => `
      <tr>
        <td class="col-check"><input type="checkbox" data-rule-id="${row.ruleId}" ${checkedIds.has(row.ruleId) ? 'checked' : ''} onchange="onRowCheckChange('${row.ruleId}', this.checked)"></td>
        <td>${row.date}</td>
        <td>${row.employeeName}</td>
        <td>${row.project}</td>
        <td>${row.workType}</td>
        <td class="wrap-cell">${row.description}</td>
        <td>${row.hours}</td>
      </tr>
    `).join('');
  }

  function renderEntriesInfo(totalEntries, start, pageCount) {
    const info = document.getElementById("entriesInfo");
    if (totalEntries === 0) {
      info.innerText = "Showing 0 to 0 of 0 entries";
      return;
    }
    info.innerText = `Showing ${start + 1} to ${start + pageCount} of ${totalEntries} entries`;
  }

  function renderPagination(totalPages) {
    const pagination = document.getElementById("pagination");
    let html = `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">Previous</button>`;

    const pages = getPageWindow(currentPage, totalPages);
    pages.forEach(p => {
      if (p === '...') {
        html += `<span class="ellipsis">&hellip;</span>`;
      } else {
        html += `<button class="${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
      }
    });

    html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">Next</button>`;
    pagination.innerHTML = html;
  }

  function getPageWindow(current, total) {
    const delta = 1;
    const range = [];
    for (let i = Math.max(1, current - delta); i <= Math.min(total, current + delta); i++) {
      range.push(i);
    }
    if (range[0] > 1) {
      if (range[0] > 2) range.unshift('...');
      range.unshift(1);
    }
    if (range[range.length - 1] < total) {
      if (range[range.length - 1] < total - 1) range.push('...');
      range.push(total);
    }
    return range;
  }

  function renderSortIndicators() {
    document.querySelectorAll('.sort-arrows').forEach(el => {
      const col = el.getAttribute('data-col');
      el.querySelectorAll('span').forEach(arrow => {
        const dir = arrow.getAttribute('data-dir');
        arrow.classList.toggle('active', col === sortColumn && dir === sortDir);
      });
    });
  }

  function syncSelectAllState(pageRows) {
    const selectAll = document.getElementById("selectAllCheckbox");
    if (pageRows.length === 0) {
      selectAll.checked = false;
      selectAll.indeterminate = false;
      return;
    }
    const checkedCount = pageRows.filter(r => checkedIds.has(r.ruleId)).length;
    selectAll.checked = checkedCount === pageRows.length;
    selectAll.indeterminate = checkedCount > 0 && checkedCount < pageRows.length;
  }

  function updateVerzendButton() {
    const btn = document.getElementById("verzendBtn");
    btn.disabled = checkedIds.size === 0;
    btn.innerText = checkedIds.size > 0 ? `Verzenden (${checkedIds.size})` : 'Verzenden';
  }

  function onSortClick(col) {
    if (sortColumn === col) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortColumn = col;
      sortDir = 'asc';
    }
    currentPage = 1;
    renderAll();
  }

  function onSearchInput() {
    searchTerm = document.getElementById("searchInput").value;
    currentPage = 1;
    renderAll();
  }

  function onPageSizeChange() {
    pageSize = parseInt(document.getElementById("pageSizeSelect").value, 10);
    currentPage = 1;
    renderAll();
  }

  function goToPage(page) {
    currentPage = page;
    renderAll();
  }

  function onRowCheckChange(ruleId, checked) {
    if (checked) checkedIds.add(ruleId);
    else checkedIds.delete(ruleId);
    const filtered = getFilteredSortedRows();
    const start = (currentPage - 1) * pageSize;
    syncSelectAllState(filtered.slice(start, start + pageSize));
    updateVerzendButton();
  }

  function onSelectAllChange() {
    const selectAll = document.getElementById("selectAllCheckbox");
    const filtered = getFilteredSortedRows();
    const start = (currentPage - 1) * pageSize;
    const pageRows = filtered.slice(start, start + pageSize);

    pageRows.forEach(row => {
      if (selectAll.checked) checkedIds.add(row.ruleId);
      else checkedIds.delete(row.ruleId);
    });

    renderTableBody(pageRows);
    updateVerzendButton();
  }

  async function verzendGeaccordeerd() {
    if (checkedIds.size === 0) return;
    const ids = Array.from(checkedIds);
    if (!confirm(`Weet je zeker dat je ${ids.length} urenregel(s) wilt accorderen?`)) return;

    const btn = document.getElementById("verzendBtn");
    btn.disabled = true;
    btn.innerText = "Bezig met verzenden...";

    const failed = [];
    for (const ruleId of ids) {
      const ok = await approveRule(ruleId);
      if (!ok) failed.push(ruleId);
    }

    allRows = allRows.filter(row => !ids.includes(row.ruleId) || failed.includes(row.ruleId));
    checkedIds = new Set(failed);

    renderAll();

    if (failed.length === 0) {
      alert(`${ids.length} urenregel(s) succesvol geaccordeerd.`);
    } else {
      alert(`${ids.length - failed.length} urenregel(s) geaccordeerd. ${failed.length} regel(s) zijn mislukt, probeer het opnieuw.`);
    }
  }

  async function approveRule(ruleId) {
    try {
      const res = await fetch(N8N_POST_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Api-Key": N8N_API_KEY
        },
        body: JSON.stringify({ ruleId, action: 'approve' })
      });
      return res.ok;
    } catch (e) {
      console.error(e);
      return false;
    }
  }
</script>

</body>
</html>
